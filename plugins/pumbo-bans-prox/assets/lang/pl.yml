# --- bans ---
# Komunikaty PumboBans (polski).
# Odpowiedzi dostają prefiks wtyczki i kolor tonu (zielony sukces, czerwony błąd,
# żółte ostrzeżenie, szara informacja), więc pisze się je bez nich. Komunikaty
# o karach są szare i same kolorują wartości: nicki &c&o, czas &a&o, powód &e&o;
# &r wraca do szarego. Powiadomienia mają dymek ze szczegółami i klik, który
# wpisuje /pb history. Ekrany (ban, wyrzucenie) i linie list wyglądają tak, jak
# tu zapisano. {nl} zaczyna nową linię. Pusta wartość wyłącza komunikat.

# --- Ekrany ukaranego gracza (przy zamknięciu połączenia) ---------------------------
screen-ban: "&c&lMasz bana na tym serwerze{nl}{nl}&7Powód: &f{reason}{nl}&7Nałożył: &f{operator}{nl}&7Pozostało: &f{remaining}{nl}&7Do: &f{expires}{nl}&7Numer kary: &f#{id}{appeal}"
screen-ban-permanent: "&c&lMasz stałego bana na tym serwerze{nl}{nl}&7Powód: &f{reason}{nl}&7Nałożył: &f{operator}{nl}&7Numer kary: &f#{id}{appeal}"
screen-appeal: "{nl}{nl}&7Odwołanie: &b{url}"
screen-kick: "&cZostałeś wyrzucony z serwera{nl}{nl}&7Powód: &f{reason}{nl}&7Wyrzucił: &f{operator}"
screen-unavailable: "&cWejście na serwer jest teraz niemożliwe{nl}{nl}&7Baza kar jest niedostępna. Spróbuj ponownie za chwilę."

# --- Komunikaty dla ukaranego gracza --------------------------------------------------
player-muted: "Masz wyciszenie do &a&o{expires}&r (pozostało: {remaining}). Powód: &e&o{reason}&r (#{id})"
player-muted-permanent: "Masz wyciszenie &a&ona stałe&r. Powód: &e&o{reason}&r (#{id})"
player-mute-notice: "&c&o{operator}&r wycisza cię{length}. Powód: &e&o{reason}&r (#{id})"
player-unmuted: Wyciszenie zostało zdjęte.
player-warned: "&c&o{operator}&r ostrzega cię. Powód: &e&o{reason}&r (#{id}, aktywne ostrzeżenia: {count})"

# --- Powiadomienia dla obsługi -------------------------------------------------------
notify-punish: "{silent}&c&o{operator}&r {action} &c&o{target}&r{length}, powód: &e&o{reason}&r ({kind} #{id})"
reply-punish: "Ukarano &c&o{target}&r{length} ({kind} #{id})"
notify-revoke: "{silent}&c&o{operator}&r zdejmuje karę nałożoną na &c&o{target}&r ({kind} #{id})"
notify-escalation: "{silent}&c&o{target}&r osiąga limit ostrzeżeń ({count}): {kind}{length} (#{id})"
notify-silent-tag: "&8[po cichu]&r "
notify-alt-join: "&c&o{player}&r wchodzi z adresu, którego używało zbanowane konto: &c&o{accounts}&r"
notify-hover: "&f{kind} #{id}{nl}&7Gracz: &f{target}{nl}&7Nałożył: &f{operator}{term}{nl}&7Serwer: &f{scope}{nl}&7Data: &f{date}{nl}&7Powód: &f{reason}{nl}&8Kliknij, żeby zobaczyć historię"
hover-term: "{nl}&7Czas: &f{duration}{nl}&7Do: &f{expires}"
scope-global: "wszystkie serwery"

