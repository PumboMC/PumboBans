# --- common ---
# Messages shared by all Pumbo plugins (English).
# Feedback messages get the plugin prefix and the colour of their tone (green
# success, red error, yellow warning, grey information) from the plugin, so they
# are written without either. & codes still work: &f...&r highlights a value, &r
# goes back to the colour of the tone. {0}, {1}, ... are arguments, {nl} starts a
# new line. An empty value disables a message. Forms separated by | depend on a
# number: "{0} day|{0} days".
command-no-permission: You don't have permission to do that.
command-unknown: Unknown subcommand {0}. Use {1}.
command-unknown-hover: Click to see the commands
command-usage: "Usage: {0}"
command-usage-hover: Click to type the command
command-players-only: Only players can use this command.
command-player-not-found: Player {0} was not found.
command-invalid-duration: "Invalid time {0}. Examples: &f30m&r, &f1d12h&r, &fperm"
command-reloaded: Configuration reloaded.
command-reload-failed: "Nothing was reloaded, a file has an error: {0}"
command-error: Something went wrong, see the server log.
command-help-empty: There are no commands you can use.
command-help-hint: Hover a command for details, click to type it.
command-help-previous: Previous page
command-help-next: Next page
command-help-permission: "Permission: {0}"
command-help-click: Click to type it in chat
version-description: Version and platform
version-platform: Platform
time-permanent: permanent
time-day: "{0} day|{0} days"
time-hour: "{0} hour|{0} hours"
time-minute: "{0} minute|{0} minutes"
time-second: "{0} second|{0} seconds"
number-separator: ","

# --- bans ---
# PumboBans messages (English).
# Replies get the plugin prefix and the colour of their tone from the plugin
# (green success, red error, yellow warning, grey information), so they are
# written without either. Messages about a punishment are grey and colour their
# values themselves: names &c&o, times &a&o, reasons &e&o; &r goes back to grey.
# Notifications get a tooltip with the details and a click that types
# /pb history. Screens (ban and kick) and list lines are shown as written.
# {nl} starts a new line. An empty value disables a message.

# --- Screens of the punished player (shown when the connection is closed) --------
screen-ban: "&c&lYou are banned from this server{nl}{nl}&7Reason: &f{reason}{nl}&7Banned by: &f{operator}{nl}&7Time left: &f{remaining}{nl}&7Until: &f{expires}{nl}&7Punishment ID: &f#{id}{appeal}"
screen-ban-permanent: "&c&lYou are permanently banned from this server{nl}{nl}&7Reason: &f{reason}{nl}&7Banned by: &f{operator}{nl}&7Punishment ID: &f#{id}{appeal}"
screen-appeal: "{nl}{nl}&7Appeal: &b{url}"
screen-kick: "&cYou were kicked from the server{nl}{nl}&7Reason: &f{reason}{nl}&7Kicked by: &f{operator}"
screen-unavailable: "&cJoining is not possible right now{nl}{nl}&7The punishment database is unavailable. Please try again later."

# --- Messages to the punished player ---------------------------------------------
player-muted: "You are muted until &a&o{expires}&r ({remaining} left). Reason: &e&o{reason}&r (#{id})"
player-muted-permanent: "You are muted &a&opermanently&r. Reason: &e&o{reason}&r (#{id})"
player-mute-notice: "&c&o{operator}&r muted you{length}. Reason: &e&o{reason}&r (#{id})"
player-unmuted: Your mute has been lifted.
player-warned: "&c&o{operator}&r warned you. Reason: &e&o{reason}&r (#{id}, active warnings: {count})"

# --- Staff notifications -------------------------------------------------------------
notify-punish: "{silent}&c&o{operator}&r {action} &c&o{target}&r{length}: &e&o{reason}&r ({kind} #{id})"
reply-punish: "Punished &c&o{target}&r{length} ({kind} #{id})"
notify-revoke: "{silent}&c&o{operator}&r lifted a punishment of &c&o{target}&r ({kind} #{id})"
notify-escalation: "{silent}Warning limit ({count}) reached by &c&o{target}&r: {kind}{length} (#{id})"
notify-silent-tag: "&8[silent]&r "
notify-alt-join: "&c&o{player}&r joined from an address used by banned &c&o{accounts}&r"
notify-hover: "&f{kind} #{id}{nl}&7Player: &f{target}{nl}&7By: &f{operator}{term}{nl}&7Server: &f{scope}{nl}&7Given: &f{date}{nl}&7Reason: &f{reason}{nl}&8Click to show the history"
hover-term: "{nl}&7Duration: &f{duration}{nl}&7Until: &f{expires}"
scope-global: "all servers"

